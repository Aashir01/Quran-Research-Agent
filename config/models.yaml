# WP-10: which model serves which agent role. Policy, not per-call-site choice.
routing:
  default_policy:
    planner:   {tier: reasoning, needs: [long_context, structured_output]}
    critic:    {tier: reasoning, needs: [structured_output], prefer_different_provider_than: scribe}
    scribe:    {tier: balanced,  needs: [long_context]}
    tafsir:    {tier: balanced,  needs: [arabic]}
    lisan:     {tier: balanced,  needs: [arabic]}
    nazm:      {tier: balanced}
    hadith:    {tier: fast}
    corpus:    {tier: fast}
    pattern:   {tier: fast}
    librarian: {tier: fast}
    extraction: {tier: fast, needs: [structured_output]}
    summarisation: {tier: fast}
    classification: {tier: fast, needs: [structured_output]}
  # WP-11: ordered fallback. The terminal entry is always `deterministic` —
  # never a weaker model, because a silently-degraded Critic is worse than an
  # absent one.
  fallback_chains:
    reasoning: [anthropic, openai, google, deepseek, ollama, deterministic]
    balanced:  [anthropic, deepseek, google, ollama, deterministic]
    fast:      [ollama, groq, anthropic, openai, deterministic]
