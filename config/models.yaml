# Model registry (WP-09).
#
# Model ids live here, not in code, because they change faster than this
# codebase will. Every entry carries `verified_on`: the date someone confirmed
# the id was live. An entry whose date is stale is a prompt to check, not a
# reason to fail — the router logs the age and carries on.
#
# Prices are USD per million tokens and feed the cost ceiling in qra/budget.py.

version: 1
verified_on: 2026-08-20

