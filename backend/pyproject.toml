[project]
name = "qra"
version = "0.1.0"
description = "Quran Research Agent — deterministic corpus retrieval, pattern mining and agentic research over a closed, fully-structured corpus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "arq>=0.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    "anthropic>=0.40",
]
mcp = ["mcp>=1.1"]
semantic = ["numpy>=2.0"]
# Local embedding and rerank models. Optional on purpose: semantic retrieval is
# off unless a provider is configured, and a disabled tier is honest.
local-models = ["sentence-transformers>=3.3", "numpy>=2.0"]
# Hosted-provider SDKs used only where the REST shape is not worth hand-rolling.
cloud = ["boto3>=1.35", "google-auth>=2.35"]
voice = ["faster-whisper>=1.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
qra = "qra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qra*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: runs the full golden eval set against the corpus"]
